<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet">

<!-- Font Awesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<title>Alpha Restaurant</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #000;
}

.video-container {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

/* ===== VIDEO ===== */
video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
}

/* ===== DARK GRADIENT ===== */
.video-gradient {
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.85));
  z-index: 1;
}

/* ===== LOGO ===== */
.logo {
  position: absolute;
  top: 40px;
  width: 100%;
  text-align: center;
  z-index: 2;
  color: white;
}

.logo img {
  width: 120px;
}

.logo p {
  font-family: 'Dancing Script', cursive;
  font-size: 32px;
  margin-top: 0px;
}

/* ===== BUTTON ===== */
.bottom-button {
  position: absolute;
  bottom: 150px;
  left: 50%;
  transform: translateX(-50%);
  padding: 14px 60px;
  background: rgba(0,0,0,0.5);
  color: #fff;
  text-decoration: none;
  border-radius: 30px;
  font-size: 18px;
  font-weight: bold;
  letter-spacing: 1px;
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,0.4);
  transition: 0.3s;
  z-index: 2;
}

.bottom-button:hover {
  background: white;
  color: black;
}

/* ===== SOCIAL ICONS ROW ===== */
.social-icons {
  position: absolute;
  bottom: 60px;
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 22px;
  flex-wrap: wrap;
  z-index: 2;
}

.social-icons a {
  font-size: 26px;
  transition: 0.3s ease;
  text-decoration: none;
}

/* Platform colors */
.instagram {
  background-image: linear-gradient(45deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}
.facebook { color: #1877F2; }
.tiktok { color: #ffffff; }
.snapchat { color: #FFFC00; }

/* Phone style */
.phone {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 18px;
  color: #25D366;
}

.phone i {
  font-size: 22px;
}

.social-icons a:hover {
  transform: scale(1.25);
}
</style>
</head>

<body>

<div class="video-container">

  <!-- Logo -->
  <div class="logo">
    <img src="./assets/n2.png" alt="Logo" />
    <p>alpha Restaurant</p>
  </div>

  <!-- Video -->
  <video autoplay muted loop playsinline preload="auto">
    <source src="./assets/vv.mp4" type="video/mp4" />
  </video>

  <!-- Welcome Button -->
  <a href="zman/zman.html" class="bottom-button">
    Welcome
  </a>

  <!-- Social Icons + Phone -->
  <div class="social-icons">

    <a href="#" class="instagram">
      <i class="fab fa-instagram"></i>
    </a>

    <a href="#" class="facebook">
      <i class="fab fa-facebook"></i>
    </a>

    <a href="#" class="tiktok">
      <i class="fab fa-tiktok"></i>
    </a>

    <a href="#" class="snapchat">
      <i class="fab fa-snapchat"></i>
    </a>

    <a href="tel:+9647500000000" class="phone">
      <i class="fas fa-phone"></i>
    
    </a>

  </div>

  <!-- Gradient Overlay -->
  <div class="video-gradient"></div>

</div>

</body>
</html>
