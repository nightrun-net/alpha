<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Café POS</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,system-ui;
}

html,body{
width:100%;
height:100%;
}

/* BODY */

body{
display:flex;
align-items:center;
justify-content:center;
background:
radial-gradient(circle at 20% 20%,#2b2b2b,#5D624C 70%);
color:white;
padding:40px;
}

/* CARD */

.card{
width:420px;
max-width:95vw;
background:#C5BEAB;
border:1px solid #262626;
border-radius:20px;
padding:45px;
box-shadow:0 30px 80px rgba(0,0,0,0.8);
backdrop-filter:blur(10px);
text-align:center;
}

/* LOGO IMAGE */


/* TITLE */

.logo{
font-size:28px;
font-weight:600;
margin-bottom:8px;
}

.sub{
font-size:13px;
color:#888;
margin-bottom:35px;
}

/* BUTTON */

button{
width:100%;
padding:14px;
border-radius:10px;
border:none;
background:#5D624C;
font-weight:600;
font-size:14px;
cursor:pointer;
transition:0.2s;
color:#fefbfb;
}

button:hover{
background:#868B6B;
}

/* FOOTER */

.footer{
margin-top:25px;
font-size:12px;
color:#000000;
}

.logo-img{
width:250px;
height:250px;
object-fit:contain;
margin-bottom:15px;
animation:float 4s ease-in-out infinite;
}

@keyframes float{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-9px)}
}
/* RESPONSIVE */

@media (min-width:1600px){

.card{
width:480px;
padding:55px;
}

.logo{
font-size:32px;
}

}

@media (max-width:768px){

body{
padding:25px;
}

.card{
width:340px;
padding:35px;
}

.logo{
font-size:24px;
}

}

@media (max-width:480px){

body{
padding:20px;
}

.card{
width:100%;
padding:28px;
border-radius:16px;
}

.logo{
font-size:22px;
}

.sub{
font-size:12px;
}

button{
padding:13px;
font-size:13px;
}

.footer{
font-size:11px;
}

}

</style>
</head>

<body>

<div class="card">

<!-- LOGO IMAGE -->
<img src="images/logo.png" class="logo-img">

<button onclick="goLogin()">
    چونا ژور
</button>

<div class="footer">
Version 1.0.3
</div>

</div>

<script>
    /* SUPABASE */
    
    const SUPABASE_URL="https://syoknmbucndsqtrzbyon.supabase.co";
    const SUPABASE_KEY="sb_publishable_YRlfXjwMSO4acrFRoTUlTw_95mAokU6";
    
    const client = supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    
    
    /* AUTO LOGIN */
    
    async function checkSession(){
    
    const { data:{session} } = await client.auth.getSession();
    
    if(!session) return;
    
    /* GET PROFILE */
    
    const {data:profile} = await client
    .from("profiles")
    .select("*")
    .eq("id",session.user.id)
    .single();
    
    if(!profile) return;
    
    /* APPROVAL */
    
    if(!profile.approved){
    window.location="waiting.html";
    return;
    }
    
    /* OWNER */
    
    if(profile.role==="owner"){
    window.location="owner_dashboard.html";
    return;
    }
    
    /* DEFAULT */
    
    window.location="home.html";
    
    }
    
    checkSession();
    
    
    /* LOGIN BUTTON */
    
    function goLogin(){
    window.location="auth.html";
    }
    
    /* disable right click */
    
    document.addEventListener("contextmenu",e=>e.preventDefault());
    
</script>
<script>

    /* DESKTOP POS PROTECTION */
    
    /* disable text selection */
    document.addEventListener("selectstart", e=>{
    e.preventDefault();
    });
    
    /* disable right click */
    document.addEventListener("contextmenu", e=>{
    e.preventDefault();
    });
    
    /* disable refresh + zoom + devtools */
    document.addEventListener("keydown",function(e){
    
    if(e.key==="F5"){
    e.preventDefault();
    }
    
    if(e.ctrlKey && (e.key==="r" || e.key==="R")){
    e.preventDefault();
    }
    
    /* disable zoom */
    if(e.ctrlKey && (e.key==="+" || e.key==="-" || e.key==="=")){
    e.preventDefault();
    }
    
    /* disable devtools */
    if(e.key==="F12"){
    e.preventDefault();
    }
    
    });
    
</script>
</body>
</html>
