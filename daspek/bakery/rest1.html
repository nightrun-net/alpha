<script>
const menu = document.querySelector(".scroll-row");
const buttons = document.querySelectorAll(".scroll-row .btn");

/* ===== STICKY ===== */
const spacer = document.createElement("div");
spacer.style.display = "none";
menu.parentNode.insertBefore(spacer, menu);

let isSticky = false;

window.addEventListener("scroll", function(){
  const rect = menu.getBoundingClientRect();

  if(rect.top <= 0 && !isSticky){
    spacer.style.height = menu.offsetHeight + "px";
    spacer.style.display = "block";
    menu.style.position = "fixed";
    menu.style.top = "0";
    menu.style.left = "0";
    menu.style.right = "0";
    menu.style.zIndex = "1000";
    menu.style.background = "#480606";
    isSticky = true;
  } 
  else if(window.scrollY < spacer.offsetTop && isSticky){
    spacer.style.display = "none";
    menu.style.position = "static";
    isSticky = false;
  }

  updateActiveButtonOnScroll();
});

/* ===== BUTTON CLICK ===== */
function btnClick(sectionId){
  const section = document.getElementById(sectionId);
  if(section){
    const topPos = section.offsetTop - menu.offsetHeight;
    window.scrollTo({ top: topPos, behavior: "smooth" });

    // Activate button only, modal should not open automatically
    setActiveButton(sectionId);
  }
}
function setActiveButton(sectionId){
  buttons.forEach(btn=>{
    btn.classList.remove("active");
    if(btn.getAttribute("onclick").includes(sectionId)){
      btn.classList.add("active");
      btn.scrollIntoView({ behavior:"smooth", inline:"center" });
    }
  });
}

function updateActiveButtonOnScroll() {
  const sections = document.querySelectorAll('.section');
  const scrollPos = window.scrollY + menu.offsetHeight + 20;

  let current = "";
  sections.forEach(section=>{
    if(scrollPos >= section.offsetTop){
      current = section.id;
    }
  });

  if(current){
    setActiveButton(current);
  }
}

/* ================== */
/* 🔥 FIXED MODAL CODE */
/* ================== */

function openPizzaModal(card){

  const section = card.closest(".section");
  const modal = section.querySelector(".pizza-modal");

  const img = card.querySelector(".pizza-img").src;
  const name = card.querySelector(".pizza-name").innerText;
  const price = card.querySelector(".pizza-price").innerText;

  modal.querySelector("#modalImg").src = img;
  modal.querySelector("#modalName").innerText = name;
  modal.querySelector("#modalPrice").innerText = price;

  modal.style.display = "flex";
}

function closePizzaModal(){
  document.querySelectorAll(".pizza-modal").forEach(modal=>{
    modal.style.display = "none";
  });
}

window.addEventListener("click", function(e){
  if(e.target.classList.contains("pizza-modal")){
    e.target.style.display = "none";
  }
});

function switchMenu(sectionId, clickedBtn) {
    // ١. هەموو لاپەڕەکان بشارەوە
    const pages = document.querySelectorAll('.menu-page');
    pages.forEach(page => {
        page.classList.remove('active-page');
    });

    // ٢. ستایلی چالاک (سوور) لە هەموو دوگمەکان لابەر
    const buttons = document.querySelectorAll('.tab-link');
    buttons.forEach(btn => {
        btn.classList.remove('active');
    });

    // ٣. ئەو لاپەڕەیەی کلیکی لێکراوە نیشانی بدە
    const selectedSection = document.getElementById(sectionId);
    if (selectedSection) {
        selectedSection.classList.add('active-page');
    }

    // ٤. دوگمەکە بکە بە چالاک (سوور)
    clickedBtn.classList.add('active');

    // ٥. گەڕانەوە بۆ سەرەوەی لاپەڕەکە بە نەرمی
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// فەنکشن بۆ کردنەوەی مۆداڵ یان بینینی زانیاری بەرهەم
