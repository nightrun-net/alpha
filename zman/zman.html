<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Zman</title>

<style>
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  margin: 0;
  font-family: Arial, sans-serif;
  position: relative;
  background: #000; /* گرنگ بۆ نەبوونی flash */
}

/* ===== BACKGROUND LAYERS ===== */
.bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  transition: opacity 1.5s ease-in-out;
  z-index: 0;
}

#bg1 { opacity: 1; }
#bg2 { opacity: 0; }

/* ===== DARK OVERLAY ===== */
#overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,0.6),
    rgba(0,0,0,0.9)
  );
  z-index: 1;
}

/* ===== CONTENT ===== */
.container {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  gap: 18px;
  align-items: center;
  justify-content: center;
  height: 100%;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

/* ===== BUTTONS ===== */
.btn {
  width: 260px;
  padding: 16px 0;
  text-align: center;
  text-decoration: none;
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 0.5px;
  color: #fff;
  background: rgba(0,0,0,0.35);
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255, 255, 255, 0.45);
  border-radius: 30px;
  box-shadow: 0 0 20px rgba(234, 133, 0, 0.25);
  cursor: pointer;
  transition: all 0.3s ease;
 
}

.btn:hover {
  transform: scale(1.07);
  box-shadow: 0 0 28px rgba(255, 255, 255, 0.5);
  background: #fff;
  color: #000;
}

.btn:active {
  transform: scale(0.95);
}
</style>
</head>

<body>

<!-- TWO BACKGROUND LAYERS -->
<div id="bg1" class="bg"></div>
<div id="bg2" class="bg"></div>

<div id="overlay"></div>

<div class="container">
  <a href="./menu/kurd/xarn2.html" class="btn">کوردی</a>
  <a href="../zman/menu/english/xarn.html" class="btn">English</a>
  <a href="./menu/arabic/xarn1.html" class="btn">العربية</a>
</div>

<script>
const images = [
  "../assets/b1.webp",
  "../assets/b2.jpg",
  "../assets/b3.webp",
  "../assets/b4.webp",
  "../assets/b5.avif",
  "../assets/b6.avif",
  "../assets/m32.jpg",
  "../assets/m34.jpeg",
  "../assets/m35.avif",
  "../assets/m36.avif",
  "../assets/m37.jpg",
  "../assets/m39.jpg"
];

let current = 0;
let activeLayer = 1;

const bg1 = document.getElementById("bg1");
const bg2 = document.getElementById("bg2");

/* Initial image */
bg1.style.backgroundImage = `url(${images[current]})`;
current++;

function changeBackground() {
  const nextImage = images[current];
  current = (current + 1) % images.length;

  if (activeLayer === 1) {
    bg2.style.backgroundImage = `url(${nextImage})`;
    bg2.style.opacity = "1";
    bg1.style.opacity = "0";
    activeLayer = 2;
  } else {
    bg1.style.backgroundImage = `url(${nextImage})`;
    bg1.style.opacity = "1";
    bg2.style.opacity = "0";
    activeLayer = 1;
  }
}

setInterval(changeBackground, 1500);
</script>

</body>
</html>
